name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [usfm-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On a usfm-updated dispatch (or manual run) regenerate the Bible chapter
      # verse JSONs from the USFM aperto-bible-dev just published, so the site's
      # verse text stays current with no manual regen+commit. Pure-stdlib Python,
      # no pip install. Regular pushes skip this and build from committed JSONs.
      - name: Regenerate Bible content from published USFM
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        env:
          USFM_REF: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/regen-from-public.py
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Astro
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
